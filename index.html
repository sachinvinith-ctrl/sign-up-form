<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sign-up-container">
  <img class="leaf-image" src="images/leaves-picture.avif" alt="leaves in a forest">
  <div class="sign-up-form">
  <div class="heading-words">
  <h1>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</h1>
  <h1>You <em>know</em> you want to.</h1></div>
  <form action="" method="post">
    <p>Let's do this!</p>
    <div class="style-form">
    <div class="left-form">
    <label for="first-name">FIRST NAME</label>
    <input type="text" id="first-name" name="first-name"></br>
    <label for="email">EMAIL</label>
    <input type="email" id="email" name="email"></br>
    <label for="password">PASSWORD</label>
    <input type="password" id="password" name="password"></br>
    </div>
    <div class="right-form">
    <label for="last-name">LAST NAME</label>
    <input type="text" id="last-name" name="last-name"></br>
    <label for="phone-number">PHONE NUMBER</label>
    <input type="number" pattern="[1-9]{1}[0-9]{9}" name="phone-number"></br>
    <label for="confirm-password">CONFIRM PASSWORD</label>
    <input type="password" id="confirm-password" name="confirm-password"></br>
    </div>
    </div>
    <button type="submit">CREATE ACCOUNT</button>
    <p>Already have an account?<a href=""> Log in</a></p>
    
  </form>
  </div>
  </div>
</body>
</html>
