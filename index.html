<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sign-up-container">
    <div class="image-container">
      <img class="leaf-image" src="images/leaves-picture.avif" alt="leaves in a forest">
      <h1 class="odin-heading">ODIN</h1>
      <div class="transparent-background">
        <img class="odin-logo" src="images/odin-logo.png">
        <p class="para-position">Photo by <a class="credit" href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie West</a> from Unsplash</p>
    </div></div>

    <div class="sign-up-form">
      <div class="heading-words">
        <h1>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</h1>
        <h1>You <em>know</em> you want to.</h1></div>

      <form action="" method="post">
        <div class="style-form">
          <div class="form-heading">
            <h2>Let's do this!</h2></div>
          <div class="input-form">
            <div class="left-form">
              <label for="first-name">FIRST NAME</label>
              <input type="text" id="first-name" name="first-name" placeholder="john"></br>
              <label for="email">EMAIL</label>
              <input type="email" id="email" name="email" placeholder="example@mail.com" required></br>
              <label for="password">PASSWORD</label>
              <input type="password" id="password" name="password" required></br>
            </div>

            <div class="right-form">
              <label for="last-name">LAST NAME</label>
              <input type="text" id="last-name" name="last-name" placeholder="doe"></br>
              <label for="phone-number">PHONE NUMBER</label>
              <input type="number" pattern="[1-9]{1}[0-9]{9}" min="10" max="10" name="phone-number" placeholder="+91-xxxxxxxxxx" required></br>
              <label for="confirm-password">CONFIRM PASSWORD</label>
              <input class="some" type="password" id="confirm-password" name="confirm-password" required></br>
            </div>
          </div>
        </div>

        <div class="submit-form">
        <button type="submit">Create Account</button>
        <p>Already have an account?<a href=""> Log in</a></p></div>
      </form>
    </div>
  </div>
</body>
</html>
